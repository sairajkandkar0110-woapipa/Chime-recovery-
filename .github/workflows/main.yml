name: Generate Perfect Device Tree (Redmi 9 Power)

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Direct Fastboot ROM URL (.tgz)'
        required: true
        default: 'https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/V14.0.2.0.SJQINXM/lime_in_global_images_V14.0.2.0.SJQINXM_20230424.0000.00_12.0_in_2dfffdd062.tgz'

jobs:
  build-tree:
    runs-on: ubuntu-22.04
    # Grants GitHub Actions the token access required to push the code back to your repo
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip aria2 tar
          pip3 install twrpdtgen

      - name: Download & Extract Stock Recovery
        run: |
          mkdir -p workspace
          cd workspace
          echo ">>> Downloading Fastboot ROM (16 connections)..."
          aria2c -x 16 -s 16 "${{ github.event.inputs.rom_url }}" -o rom.tgz
          
          echo ">>> Extracting recovery.img..."
          tar -xf rom.tgz --wildcards "*/images/recovery.img" --strip-components=2

      - name: Generate Base Device Tree
        run: |
          cd workspace
          python3 -m twrpdtgen recovery.img -o dt
          
          # Find the exact path where the files were generated (chime or lime)
          DT_PATH=$(find dt -type d -name "chime" -o -name "lime" | head -n 1)
          echo "DT_PATH=$DT_PATH" >> $GITHUB_ENV
          echo "DEVICE_NAME=$(basename $DT_PATH)" >> $GITHUB_ENV

      - name: Apply Kernel, Decryption & EROFS Configurations
        run: |
          cd workspace
          TARGET_DIR="${{ env.DT_PATH }}"
          
          # 1. Structure Prebuilt Kernel Folder
          mkdir -p "$TARGET_DIR/prebuilt"
          mv "$TARGET_DIR/kernel" "$TARGET_DIR/prebuilt/kernel" 2>/dev/null || true
          mv "$TARGET_DIR/dtb.img" "$TARGET_DIR/prebuilt/dtb" 2>/dev/null || true
          mv "$TARGET_DIR/dtb" "$TARGET_DIR/prebuilt/dtb" 2>/dev/null || true
          
          # 2. Inject BoardConfig with Perfect Parameters
          BOARDCONFIG="$TARGET_DIR/BoardConfig.mk"
          
          # Delete default kernel paths written by twrpdtgen
          sed -i '/TARGET_PREBUILT_KERNEL/d' "$BOARDCONFIG"
          sed -i '/BOARD_PREBUILT_DTBIMAGE_DIR/d' "$BOARDCONFIG"
          
          cat << 'EOF' >> "$BOARDCONFIG"
          
          # --- PERFECT TREE INJECTIONS ---
          
          # Prebuilt Kernel Config
          TARGET_PREBUILT_KERNEL := $(DEVICE_PATH)/prebuilt/kernel
          BOARD_PREBUILT_DTBIMAGE_DIR := $(DEVICE_PATH)/prebuilt/dtb
          BOARD_INCLUDE_DTB_IN_BOOTIMG := true
          BOARD_BOOT_HEADER_VERSION := 2
          BOARD_MKBOOTIMG_ARGS := --header_version $(BOARD_BOOT_HEADER_VERSION)
          BOARD_EXCLUDE_KERNEL_FROM_RECOVERY_IMAGE := false
          
          # FBE Decryption 
          TW_INCLUDE_CRYPTO := true
          TW_INCLUDE_CRYPTO_FBE := true
          TW_INCLUDE_FBE_METADATA_DECRYPT := true
          BOARD_USES_METADATA_PARTITION := true
          BOARD_USES_QCOM_FBE_DECRYPTION := true
          
          # Dynamic Partitions & EROFS
          BOARD_SUPER_PARTITION_SIZE := 9126805504
          BOARD_SUPER_PARTITION_GROUPS := qti_dynamic_partitions
          BOARD_QTI_DYNAMIC_PARTITIONS_SIZE := 9122611200
          TW_INCLUDE_FASTBOOTD := true
          
          TARGET_USERIMAGES_USE_EXT4 := true
          TARGET_USERIMAGES_USE_F2FS := true
          BOARD_SYSTEMIMAGE_FILE_SYSTEM_TYPE := erofs
          BOARD_VENDORIMAGE_FILE_SYSTEM_TYPE := erofs
          BOARD_PRODUCTIMAGE_FILE_SYSTEM_TYPE := erofs
          BOARD_SYSTEM_EXTIMAGE_FILE_SYSTEM_TYPE := erofs
          
          # Standard Recovery Modules
          OFOX_AB_DEVICE := false
          TARGET_RECOVERY_DEVICE_MODULES += adbd
          TW_ALWAYS_RMRF := true
          TW_INCLUDE_NTFS_3G := true
          EOF
          
          # 3. Restructure File Systems Map (recovery.fstab)
          FSTAB="$TARGET_DIR/recovery.fstab"
          
          # Fix Metadata Decryption Mount
          sed -i 's|/metadata.*|/metadata ext4 /dev/block/bootdevice/by-name/metadata flags=display="Metadata"|g' "$FSTAB"
          
          # Clear old auto-generated logic partitions
          sed -i '/system /d' "$FSTAB"
          sed -i '/vendor /d' "$FSTAB"
          sed -i '/product /d' "$FSTAB"
          sed -i '/system_ext /d' "$FSTAB"
          sed -i '/odm /d' "$FSTAB"
          
          # Inject EROFS and EXT4 fallback directly at the top of the file
          sed -i '1i # Logical (EXT4 Fallback)\nsystem /system ext4 ro wait,logical,first_stage_mount\nvendor /vendor ext4 ro wait,logical,first_stage_mount\nproduct /product ext4 ro wait,logical,first_stage_mount\nsystem_ext /system_ext ext4 ro wait,logical,first_stage_mount\n\n' "$FSTAB"
          sed -i '1i # Logical (EROFS)\nsystem /system erofs ro wait,logical,first_stage_mount\nvendor /vendor erofs ro wait,logical,first_stage_mount\nproduct /product erofs ro wait,logical,first_stage_mount\nsystem_ext /system_ext erofs ro wait,logical,first_stage_mount\n' "$FSTAB"
          
          # 4. Clean up obsolete files and standardize Makefile names
          rm -rf "$TARGET_DIR/vendorsetup.sh"
          mv "$TARGET_DIR/omni_${{ env.DEVICE_NAME }}.mk" "$TARGET_DIR/twrp_${{ env.DEVICE_NAME }}.mk" 2>/dev/null || true
          sed -i 's/omni/twrp/g' "$TARGET_DIR/AndroidProducts.mk"
          sed -i 's/omni/twrp/g' "$TARGET_DIR/twrp_${{ env.DEVICE_NAME }}.mk"

      - name: Push Device Tree to Repo Root
        run: |
          # Copy files out of the workspace directly into the root folder of your repo
          cp -r workspace/${{ env.DT_PATH }}/* ./
          
          # Delete the workspace so it doesn't get pushed alongside the tree
          rm -rf workspace
          
          # Setup Git Bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Commit the changes and push them back to GitHub
          git add .
          git commit -m "Auto-generated PERFECT device tree for ${{ env.DEVICE_NAME }}"
          git push origin HEAD:${GITHUB_REF}
          
