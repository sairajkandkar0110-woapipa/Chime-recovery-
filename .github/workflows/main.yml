name: Build OrangeFox (Redmi 9 Power)

on:
  workflow_dispatch:

jobs:
  build-recovery:
    runs-on: ubuntu-22.04
    steps:
      # Step 1: Nuke pre-installed software to free up ~30GB of disk space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # Step 2: Install build environment & twrpdtgen
      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3-pip aria2 cpio tar curl openjdk-11-jdk python-is-python3
          pip3 install twrpdtgen
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      # Step 3: Automatically download and extract your hardcoded Fastboot ROM
      - name: Download & Extract Stock Image
        run: |
          mkdir -p $GITHUB_WORKSPACE/rom
          cd $GITHUB_WORKSPACE/rom
          
          # Hardcoded URL injected here
          URL="https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/V14.0.2.0.SJQINXM/lime_in_global_images_V14.0.2.0.SJQINXM_20230424.0000.00_12.0_in_2dfffdd062.tgz"
          
          echo ">>> Fastboot ROM archive link detected. Downloading via aria2c..."
          aria2c -x 16 -s 16 "$URL" -o stock_rom.tgz
          
          echo ">>> Extracting recovery.img from archive..."
          tar -xf stock_rom.tgz --wildcards "*/images/recovery.img" --strip-components=2

      # Step 4: Generate Device Tree from the extracted image
      - name: Generate Device Tree
        run: |
          python3 -m twrpdtgen $GITHUB_WORKSPACE/rom/recovery.img -o $GITHUB_WORKSPACE/dt
          DT_PATH=$(find $GITHUB_WORKSPACE/dt -type d -name "chime" -o -name "lime" | head -n 1)
          echo "DT_PATH=$DT_PATH" >> $GITHUB_ENV

      # Step 5: Sync OrangeFox Manifest using the official script
      - name: Sync OrangeFox Manifest
        run: |
          git clone https://gitlab.com/OrangeFox/sync.git $GITHUB_WORKSPACE/fox_sync
          cd $GITHUB_WORKSPACE/fox_sync
          ./orangefox_sync.sh --branch 12.1 --path $GITHUB_WORKSPACE/fox

      # Step 6: Copy generated tree, inject flags, fix makefiles
      - name: Inject Decryption & Configure Makefiles
        run: |
          # Using wildcard for chime/lime pathing
          TARGET_DT_DIR="$GITHUB_WORKSPACE/fox/device/xiaomi/$(basename ${{ env.DT_PATH }})"
          mkdir -p $(dirname "$TARGET_DT_DIR")
          cp -r ${{ env.DT_PATH }} "$TARGET_DT_DIR"
          
          echo ">>> Deleting legacy vendorsetup.sh to fix add_lunch_combo crash..."
          rm -rf "$TARGET_DT_DIR/vendorsetup.sh"
          
          # Inject BoardConfig flags
          BOARDCONFIG="$TARGET_DT_DIR/BoardConfig.mk"
          cat << 'EOF' >> "$BOARDCONFIG"
          
          # OrangeFox specific parameters
          OFOX_AB_DEVICE := false
          TARGET_DEVICE_ALT := juice,chime,citrus,lime,lemon,pomelo
          TARGET_ARCH := arm64
          ALLOW_MISSING_DEPENDENCIES := true
          TW_INCLUDE_RESETPROP := true
          TW_NO_BIND_SYSTEM := true
          TARGET_RECOVERY_DEVICE_MODULES += adbd
          TW_ALWAYS_RMRF := true
          
          # Qualcomm FBE Decryption
          TW_INCLUDE_CRYPTO := true
          TW_INCLUDE_CRYPTO_FBE := true
          TW_INCLUDE_FBE_METADATA_DECRYPT := true
          BOARD_USES_METADATA_PARTITION := true
          BOARD_USES_QCOM_FBE_DECRYPTION := true
          
          # UI parameters
          TW_THEME := portrait_hdpi
          TW_EXTRA_LANGUAGES := false
          TW_INCLUDE_NTFS_3G := true
          EOF
          
          # Update fstab for metadata encryption key path
          sed -i 's|/metadata.*|/metadata ext4 /dev/block/bootdevice/by-name/metadata flags=display="Metadata"|g' "$TARGET_DT_DIR/recovery.fstab" 2>/dev/null || true
          
          # ---> THIS IS THE FIX FOR YOUR LUNCH ERROR <---
          echo ">>> Aligning Makefile naming convention with Fox..."
          mv "$TARGET_DT_DIR/omni_"*".mk" "$TARGET_DT_DIR/twrp_$(basename ${{ env.DT_PATH }}).mk" 2>/dev/null || true
          sed -i 's/omni/twrp/g' "$TARGET_DT_DIR/AndroidProducts.mk"

      # Step 7: Compile OrangeFox
      - name: Compile OrangeFox
        run: |
          cd $GITHUB_WORKSPACE/fox
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL="C"
          lunch twrp_$(basename ${{ env.DT_PATH }})-eng
          mka recoveryimage -j$(nproc --all)

      # Step 8: Upload Artifact
      - name: Upload Finished Recovery
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-lime-recovery
          path: fox/out/target/product/*/recovery.img
          
