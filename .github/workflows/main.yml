name: Compile OrangeFox from Repo Tree

on:
  workflow_dispatch:
    inputs:
      device_name:
        description: 'Device Codename (e.g., lime or chime)'
        required: true
        default: 'lime'

jobs:
  build-recovery:
    runs-on: ubuntu-22.04
    steps:
      # Step 1: Maximize build space on the cloud runner
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # Step 2: Install required compilation tools
      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3-pip aria2 cpio tar curl openjdk-11-jdk python-is-python3
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      # Step 3: Checkout your perfect device tree from the repo
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: repo_tree

      # Step 4: Sync the OrangeFox 12.1 Manifest to a separate directory
      - name: Sync OrangeFox Manifest
        run: |
          git clone https://gitlab.com/OrangeFox/sync.git $HOME/fox_sync
          cd $HOME/fox_sync
          ./orangefox_sync.sh --branch 12.1 --path $HOME/fox

      # Step 5: Move your custom device tree and INJECT MISSING FLAGS
      - name: Setup Device Tree
        run: |
          DEVICE="${{ github.event.inputs.device_name }}"
          TARGET_DIR="$HOME/fox/device/xiaomi/$DEVICE"
          
          mkdir -p "$TARGET_DIR"
          
          # Copy the tree from the GitHub repo into the Android build system
          cp -r $GITHUB_WORKSPACE/repo_tree/* "$TARGET_DIR/"
          
          echo ">>> Injecting missing partition map and brightness variables..."
          cat << 'EOF' >> "$TARGET_DIR/BoardConfig.mk"
          
          # Partition Copy Out Paths
          TARGET_COPY_OUT_VENDOR := vendor
          TARGET_COPY_OUT_PRODUCT := product
          TARGET_COPY_OUT_SYSTEM_EXT := system_ext
          
          # Display Brightness Settings
          TW_MAX_BRIGHTNESS := 2047
          TW_DEFAULT_BRIGHTNESS := 1200
          EOF
          
          # ---> THIS IS THE FIX FOR YOUR DTB CRASH <---
          echo ">>> Removing empty DTB requirements..."
          sed -i '/BOARD_PREBUILT_DTBIMAGE_DIR/d' "$TARGET_DIR/BoardConfig.mk"
          sed -i '/BOARD_INCLUDE_DTB_IN_BOOTIMG/d' "$TARGET_DIR/BoardConfig.mk"
          
          echo ">>> Verifying Tree Structure in $TARGET_DIR:"
          ls -la "$TARGET_DIR"

      # Step 6: Compile the Recovery Image
      - name: Compile OrangeFox
        run: |
          DEVICE="${{ github.event.inputs.device_name }}"
          cd $HOME/fox
          
          # Set up strict environment variables
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL="C"
          export FOX_BUILD_DEVICE="$DEVICE"
          
          # Turn off GitHub's strict error crashing for the AOSP setup script
          set +e
          source build/envsetup.sh
          set -e
          
          # Initialize the build target (try eng first, fallback to userdebug)
          lunch twrp_${DEVICE}-eng || lunch twrp_${DEVICE}-userdebug
          
          # Compile the image using all available CPU cores
          mka recoveryimage -j$(nproc --all)

      # Step 7: Output the finished file for download
      - name: Upload Finished Recovery
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-${{ github.event.inputs.device_name }}-recovery
          path: /home/runner/fox/out/target/product/${{ github.event.inputs.device_name }}/recovery.img
          
